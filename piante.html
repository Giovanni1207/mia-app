}
}

video.srcObject=stream;

function takePhoto(){

const canvas=
document.getElementById("canvas");

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=
canvas.getContext("2d");

ctx.drawImage(
video,
0,
0
);

const image=
canvas
.toDataURL("image/jpeg")
.split(",")[1];

identifyPlant(image);

}

async function identifyPlant(image){

document.getElementById("result").innerHTML=
`
<div class="card">
Analisi in corso...
</div>
`;

try{

const response=
await fetch(
"https://api.plant.id/v2/identify",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Api-Key":API_KEY
},
body:JSON.stringify({

images:[image],

plant_details:[
"common_names",
"url",
"wiki_description"
]

})

});

const data=
await response.json();

const plant=
data.suggestions[0];

let scientific=
plant.plant_name;

let common=
plant.plant_details
.common_names?.[0]
|| scientific;

let description=
plant.plant_details
.wiki_description?.value
|| "Nessuna descrizione disponibile";

let care =
generateCare(common);

document.getElementById("result").innerHTML=
`

<div class="card">

<h2>${common}</h2>

<h3>${scientific}</h3>

<p>${description}</p>

<h3>☀ Esposizione</h3>
<p>${care.light}</p>

<h3>💧 Irrigazione</h3>
<p>${care.water}</p>

<h3>🌡 Temperatura</h3>
<p>${care.temp}</p>

<h3>🌱 Cura</h3>
<p>${care.care}</p>

</div>

`;

saveHistory(common);

}
catch(err){

document.getElementById("result").innerHTML=
`
<div class="card">
Errore riconoscimento.
</div>
`;

}

}
